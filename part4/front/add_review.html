<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CringeBnb - Add Review</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/favicon-96x96.png">

</head>

<body>

    <!--==========================================HEADER========================================-->
    <header>
        <div class="header-top">
            <div class="logo">
                <img src="images/logo.png" height="67px" width="467px" alt="CringBnb logo">
                <p class="slogan">Where too much isn't quite enough!</p>
            </div>

            <div class="icon">
                <img src="images/icon.png" height="150px" width="134px" alt="CringBnb icon">
            </div>
        </div>

        <!-----------------------------------NAV------------------------------------->
        <nav>
            <a href="login.html" class="login-button">Login</a>
            <a href="index.html">Home</a>
            <a href="index.html" class="logout-button" style="display:none;">Logout</a>
        </nav>


    </header>


    <!--============================================MAIN==================================-->
    <main>
        <!-- Add something to idfentify the place you're reviewing -->
        <form id="review-form">
            <h2>Add a Review</h2>
            <label for="review">Your Review:</label>
            <textarea id="review" name="review" required></textarea>
            <label for="rating">Rating:</label>
            <select id="rating" name="rating" required>
                <!-- Options for rating -->
            </select>
            <button type="submit">Submit Review</button>
        </form>
    </main>

    <!--=======================================FOOTER=============================-->
    <footer>
        <!----------------------------------JUKEBOXE-------------------------------->

        <div class="cringebox">
            <h2>💿 Cringebox 3000 — Choose your mood ✨</h2>

            <!-- Jukebox Buttons -->
            <div id="jukebox" style="display:flex; flex-wrap:wrap; justify-content:center; gap:15px;">
                <button class="jukebox-btn" onclick="playMusic('musique1.mp3', this)">🌈 Prisoner of Love 🌈</button>
                <button class="jukebox-btn" onclick="playMusic('musique2.mp3', this)">🌔 Not my Mind, Not my Planet
                    🌔</button>
                <button class="jukebox-btn" onclick="playMusic('musique3.mp3', this)">💔 Quitling 💔</button>
                <button class="jukebox-btn" onclick="playMusic('musique4.mp3', this)">🦄 Therapy 🦄</button>
                <button class="jukebox-btn" onclick="playMusic('musique4.mp3', this)">🏄‍♀️ Cosmic Renegade
                    🏄‍♀️</button>
            </div>
        </div>

        <audio id="player" loop></audio>

        <!----------------------------------IMAGES---------------------------->
        <div class="footer-images">
            <div class="top-row">
                <div class="left-block">
                    <img class="logo" src="images/logo.png" height="67px" width="467px" alt="CringeBnb logo">
                    <p>All rights reserved</p>
                </div>
                <img class="icon" src="images/icon.png" height="150px" width="134px" alt="CringBnb icon">
            </div>

            <img class="footer-emojis" src="" alt="Emojis">
        </div>


    </footer>


    <script src="js/checkAuth.js"></script>
    <script src="js/addReview.js"></script>
    <script src="js/footer.js"></script>
</body>

</html>
